name: Deploy front dev -> pruebas.qeb.mx (VPS)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-pruebas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (apunta al proxy same-origin del VPS)
        env:
          VITE_API_URL: /api
          VITE_SAP_URL: https://sap.qeb.mx
        run: npm run build

      - name: Sellar commit en version.json
        run: |
          node -e "const fs=require('fs');const f='dist/version.json';let v={};try{v=JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){};v.commit=process.env.GITHUB_SHA;v.commitShort=(process.env.GITHUB_SHA||'').slice(0,7);v.ref=process.env.GITHUB_REF_NAME;v.deployedAt=new Date().toISOString();fs.writeFileSync(f,JSON.stringify(v));console.log('version.json ->',fs.readFileSync(f,'utf8'))"

      - name: Subir dist al VPS (rsync)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 104.236.96.1 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ deploy@104.236.96.1:/var/www/pruebas.qeb.mx/
